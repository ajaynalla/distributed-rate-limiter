services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    ports:
      - "8080:8080"
    environment:
      RATE_LIMITER_MODE: REDIS
      RATE_LIMITER_REDIS_HOST: redis
      DASHBOARD_ENABLED: "true"
      DASHBOARD_REDIS_ENABLED: "true"
    depends_on:
      redis:
        condition: service_healthy
