name: Verify live Java deployment

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: Actual HTTPS Java origin returned by the hosting provider
        required: true
        type: string
      frontend_url:
        description: Public frontend HTTPS origin
        required: true
        default: https://ratelab-ajaynalla.ajaykumarnalla98.chatgpt.site
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify real Java, Redis, failure policy, and CORS behavior
        env:
          BACKEND_URL: ${{ inputs.backend_url }}
          FRONTEND_URL: ${{ inputs.frontend_url }}
        run: python scripts/verify_deployment.py "$BACKEND_URL" --frontend "$FRONTEND_URL" > deployment-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-deployment-verification
          path: deployment-report.json
          retention-days: 7
