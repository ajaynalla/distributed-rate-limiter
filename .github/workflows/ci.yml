name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  deployment-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s scripts -p 'test_*.py' -v
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Validate combined Docker image
        run: docker build -f docker/Dockerfile.dashboard -t ratelab-dashboard:ci .
        working-directory: .
      - name: Verify container serves UI and Java API
        working-directory: .
        run: |
          docker network create ratelab-ci
          docker run -d --network ratelab-ci --name ratelab-redis redis:7-alpine
          for i in $(seq 1 15); do
            if docker exec ratelab-redis redis-cli ping; then break; fi
            sleep 1
          done
          docker run -d --network ratelab-ci --name ratelab-smoke -p 8080:8080 -e DASHBOARD_ENABLED=true -e DASHBOARD_REDIS_ENABLED=true -e RATE_LIMITER_MODE=REDIS -e RATE_LIMITER_REDIS_HOST=ratelab-redis ratelab-dashboard:ci
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:8080/actuator/health/liveness; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8080/ | grep 'RateLab'
          curl -fsS http://localhost:8080/v1/dashboard/config | grep 'demoEnabled'
          node scripts/smoke.mjs
          python3 scripts/verify_deployment.py http://localhost:8080 --frontend http://localhost:8080 --origin http://localhost:5173 --attempts 1
          docker compose -f docker-compose.dashboard.yml config --quiet
      - name: Container logs
        if: failure()
        run: docker logs ratelab-smoke
        working-directory: .
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Compile
        run: mvn -B compile

      - name: Unit + concurrency tests
        run: mvn -B test

      - name: Publish unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

      - name: Static analysis (SpotBugs)
        run: mvn -B spotbugs:check

      # Testcontainers needs a Docker daemon; GitHub-hosted ubuntu
      # runners provide one out of the box.
      - name: Integration tests (Redis via Testcontainers)
        run: mvn -B verify -Dsurefire.skip=true

      - name: Publish integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports
          path: target/failsafe-reports/
          retention-days: 7

      - name: Package
        run: mvn -B -DskipTests package

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: distributed-rate-limiter-jar
          path: target/distributed-rate-limiter.jar
          retention-days: 14
