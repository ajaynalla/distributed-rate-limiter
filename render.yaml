# Free portfolio deployment. Never substitute a paid plan without approval.
# Verify workspace usage/payment settings before applying: free compute does not cap bandwidth overages.
previews:
  generation: "off"
services:
  - type: web
    name: ratelab-java
    runtime: docker
    plan: free
    region: virginia
    branch: main
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - src/**
        - frontend/**
        - docker/**
        - pom.xml
        - render.yaml
    dockerfilePath: ./docker/Dockerfile.dashboard
    healthCheckPath: /actuator/health/liveness
    envVars:
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=55 -XX:ActiveProcessorCount=2 -Xss512k"
      - key: DASHBOARD_ENABLED
        value: "true"
      - key: DASHBOARD_REDIS_ENABLED
        value: "true"
      - key: RATE_LIMITER_MODE
        value: REDIS
      - key: RATE_LIMITER_WINDOW_MILLIS
        value: "10000"
      - key: RATE_LIMITER_REDIS_CONNECT_TIMEOUT_MILLIS
        value: "2000"
      - key: RATE_LIMITER_REDIS_COMMAND_TIMEOUT_MILLIS
        value: "5000"
      - key: RATE_LIMITER_REDIS_MAX_RETRIES
        value: "1"
      - key: RATE_LIMITER_REDIS_HOST
        fromService:
          type: keyvalue
          name: ratelab-redis
          property: host
      - key: RATE_LIMITER_REDIS_PORT
        fromService:
          type: keyvalue
          name: ratelab-redis
          property: port
      - key: DASHBOARD_ALLOWED_ORIGINS
        value: "https://ratelab-ajaynalla.ajaykumarnalla98.chatgpt.site"
  - type: keyvalue
    name: ratelab-redis
    plan: free
    region: virginia
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: "off"
