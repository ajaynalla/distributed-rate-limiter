server:
  port: ${PORT:8080}

spring:
  application:
    name: distributed-rate-limiter
  mvc:
    problemdetails:
      enabled: true

# See com.ratelimiter.config.RateLimiterProperties for the full shape.
rate-limiter:
  mode: IN_MEMORY # IN_MEMORY | REDIS
  limit: 10
  window-millis: 1000
  redis:
    host: localhost
    port: 6379
    key-prefix: "rl:"
    connect-timeout-millis: 200
    command-timeout-millis: 200
    failure-policy: FAIL_OPEN # FAIL_OPEN | FAIL_CLOSED
    max-retries: 2
    base-backoff-millis: 20
    max-backoff-millis: 200
    circuit-breaker-failure-threshold: 5
    circuit-breaker-open-duration-millis: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

# The interactive lab is opt-in and isolated from /v1/rate-limit/check.
dashboard:
  enabled: ${DASHBOARD_ENABLED:false}
  redis-enabled: ${DASHBOARD_REDIS_ENABLED:false}
  allowed-origins: ${DASHBOARD_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
